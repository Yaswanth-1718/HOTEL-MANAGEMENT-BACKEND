# ==============================================================
# SERVER CONFIG
# ==============================================================
server.port=${PORT:8081}

# ==============================================================
# DATABASE CONFIG (H2 PERSISTENT)
# ==============================================================
# Using a local file path so your Users and Bookings remain after restart
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/hoteldb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

# H2 CONSOLE - Access via http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Allows the console to be used within your browser's frame
spring.h2.console.settings.web-allow-others=true

# ==============================================================
# JPA / HIBERNATE / JACKSON
# ==============================================================
# 'update' is critical: it adds the 'app_users' table without deleting bookings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Date handling for React (2026-03-29 format)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# ==============================================================
# EMAIL CONFIGURATION (Gmail SMTP)
# ==============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=saiyaswanth640@gmail.com
spring.mail.password=kuwjbrfldlkjbesq

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================================
# ASYNC CONFIG (Background Email)
# ==============================================================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.thread-name-prefix=HotelEmail-